name: Construire l'appli Android (APK)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - name: Installer les dépendances
        run: npm ci
      - name: Copier le jeu dans le projet Android
        run: npx cap sync android
      - name: Compiler l'APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: Renommer
        run: cp android/app/build/outputs/apk/debug/app-debug.apk White-Picket.apk
      - uses: actions/upload-artifact@v4
        with:
          name: White-Picket-apk
          path: White-Picket.apk
      - name: Publier dans la release « latest »
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: White Picket — dernière version Android
          body: "APK à installer directement sur un téléphone Android (autoriser l’installation depuis cette source). Version de test, non signée pour le Play Store."
          files: White-Picket.apk
          make_latest: true
