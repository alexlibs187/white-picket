name: Construire l'appli Android (APK)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Installer les dépendances
        run: npm ci
      - name: Copier le jeu dans le projet Android
        run: |
          npx cap sync android > sync.log 2>&1 || { echo "::error::$(tail -c 1500 sync.log | tr '\n' ' ')"; exit 1; }
          cat sync.log
      - name: Vérifier le SDK Android
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME"
      - name: Compiler l'APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon > build.log 2>&1 || { echo "::error::$(grep -E 'error|FAILURE|What went wrong' -A3 build.log | head -c 1800 | tr '\n' ' ')"; exit 1; }
      - name: Renommer
        run: cp android/app/build/outputs/apk/debug/app-debug.apk White-Picket.apk
      - uses: actions/upload-artifact@v4
        with:
          name: White-Picket-apk
          path: White-Picket.apk
      - name: Publier dans la release « latest »
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: White Picket — dernière version Android
          body: "APK à installer directement sur un téléphone Android (autoriser l’installation depuis cette source). Version de test, non signée pour le Play Store."
          files: White-Picket.apk
          make_latest: true
